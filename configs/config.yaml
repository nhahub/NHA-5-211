project:
  name: "SMART IDS v3"
  subtitle: "Multi-Model Intrusion Detection with Zero-Day Anomaly Tracking"
  version: "3.0.0"
  random_seed: 42

paths:
  raw_data_dir: "data/raw"
  processed_data_dir: "data/processed"
  synthetic_data_dir: "data/synthetic"
  models_dir: "models"
  artifacts_dir: "artifacts"
  reports_dir: "reports"
  figures_dir: "reports/figures"
  response_log_file: "reports/ids_response_log.txt"
  incident_history_file: "reports/incident_history.json"

data:
  dataset_name: "CICIDS2017"
  expected_raw_files:
    - "Monday-WorkingHours.pcap_ISCX.csv"
    - "Tuesday-WorkingHours.pcap_ISCX.csv"
    - "Wednesday-workingHours.pcap_ISCX.csv"
    - "Thursday-WorkingHours-Morning-WebAttacks.pcap_ISCX.csv"
    - "Thursday-WorkingHours-Afternoon-Infilteration.pcap_ISCX.csv"
    - "Friday-WorkingHours-Morning.pcap_ISCX.csv"
    - "Friday-WorkingHours-Afternoon-PortScan.pcap_ISCX.csv"
    - "Friday-WorkingHours-Afternoon-DDos.pcap_ISCX.csv"
  sample_size: 200000
  use_full_dataset: false # Set true to bypass stratified downsampling across all ~2.83M raw rows
  max_rows_sample: 200000
  label_correction_file: "data/engelen2021_label_corrections.csv" # Optional Engelen et al. (2021) relabeling CSV/Parquet
  synthetic_fallback:
    enabled: true
    n_samples: 60000
    duplicate_fraction: 0.004
    inf_fraction: 0.008
    nan_fraction: 0.003
    class_weights:
      BENIGN: 0.83
      DoS Hulk: 0.06
      PortScan: 0.04
      DDoS: 0.03
      DoS GoldenEye: 0.01
      FTP-Patator: 0.01
      SSH-Patator: 0.01
      Web Attack: 0.01
  label_column: "Label"
  canonical_classes:
    - "BENIGN"
    - "DoS Hulk"
    - "PortScan"
    - "DDoS"
    - "DoS GoldenEye"
    - "FTP-Patator"
    - "SSH-Patator"
    - "Web Attack"
  merge_web_attacks: true
  drop_ultra_rare_classes_below: 10
  nan_column_drop_threshold: 0.50
  outlier_clip_sigma: 5.0
  identifier_keywords:
    - "ip"
    - "timestamp"
    - "flow id"
    - "src"
    - "dst"
    - "source port"
  preserve_features:
    - "Destination Port"
  drop_features: []
  strict_leakage_check: true
  split_strategy: "random" # random | by_day (open-set cross-day: Mon-Wed train, part of Thu val, Thu-Fri unseen attacks) | time_block (chronological per-class ~60%/~20%/~20%)
  timestamp_source_dir: "data/TrafficLabelling" # Optional CICIDS2017 GeneratedLabelledFlows/TrafficLabelling CSV dir for real Timestamp alignment
  split:
    # Matches report for random: 15% held-out test, then 15% of remainder validation (12.75% val, 72.25% train)
    test_size: 0.15
    val_size_of_remainder: 0.15
    thursday_val_fraction: 0.50
    time_block_train_fraction: 0.60
    time_block_val_fraction: 0.20
    stratify: true
  imbalance:
    strategy: "auto_compare" # Compares None, Class-Weight, and SMOTE on validation Macro-F1; options: smote, class_weight, none, auto_compare
    imbalance_tie_tolerance: 0.002 # Within tolerance, prefer simplest: none > class_weight > smote
    smote_sampling_strategy: "auto"
    smote_max_k_neighbors: 5
    smote_cap_per_class: 5000 # Caps minority oversampling at 5,000 samples (or smote_max_multiplier x real size)
    smote_max_multiplier: 5.0 # Bounds synthetic oversampling to at most 5x the real class size
    smote_min_real_samples: 50 # Classes with fewer real train rows skip SMOTE and receive class weights instead

imbalance_selection:
  per_model: true # Evaluate {none, class_weight, smote} on each model's own val Macro-F1 (MLP, 1D-CNN, XGBoost)
  neural_epochs_cap: 10 # Epoch cap for MLP and 1D-CNN candidate runs during strategy selection

evaluation:
  latency_warmup_calls: 50 # Discard first N warm-up calls before recording single-flow latency
  latency_timed_runs: 100
  batch_benchmark_size: 1024
  shap_xgb_max_samples: 500
  shap_mlp_background_samples: 50
  shap_mlp_explain_samples: 20
  autoencoder_percentiles: [90, 95, 97, 99]
  unseen_attack_holdout_class: "Web Attack"
  run_by_day_comparison: true # Open-set cross-day protocol (Mon-Wed train, Thu-Fri unseen attacks)
  by_day_keras_epochs: 20
  run_time_block_comparison: true # Chronological per-class temporal drift split (~60%/~20%/~20%)
  time_block_keras_epochs: 20
  run_feature_ablation: true
  ablation_drop_features:
    - "Destination Port"
  bootstrap_n_resamples: 1000
  low_support_threshold: 30
  reliable_support_threshold: 30 # Minimum test support for Reliable-Class Macro-F1 (shown alongside all-class Macro-F1)
  run_mitigation_analysis: true # Run time_block confusion/KS drift analysis + recall-vs-FPR mitigation tables
  failing_class_recall_threshold: 0.85
  drift_top_k_features: 5
  mitigation_benign_percentiles: [90, 95, 97, 99]
  run_sample_size_sensitivity: true # Compare XGBoost at configured sample_size vs larger sensitivity sample
  sensitivity_sample_sizes: [200000, 500000]
  run_xgboost_cv: true
  cv_n_splits: 5

response:
  dry_run: true
  rate_limit_pps: 100
  threat_thresholds:
    Low: [0.0, 0.40]
    Medium: [0.40, 0.70]
    High: [0.70, 0.90]
    Critical: [0.90, 1.01]
  threat_colors:
    Low: "#22c55e"
    Medium: "#eab308"
    High: "#f97316"
    Critical: "#ef4444"
  threat_icons:
    Low: "🟢"
    Medium: "🟡"
    High: "🟠"
    Critical: "🔴"

security:
  verify_model_hashes: true # Verify SHA-256 against models/MANIFEST.json before every joblib load
  require_manifest: false # Set true in locked production deployments to fail when MANIFEST.json is missing
  manifest_file: "MANIFEST.json"

models_download:
  release_base_url: "" # Optional GitHub Release asset URL fallback, e.g. https://github.com/<owner>/<repo>/releases/download/models-v3
  release_repo: "" # Alternative "owner/repo" used with release_tag when release_base_url is empty
  release_tag: "models-v3"

dashboard:
  page_title: "SMART IDS v3 — Hybrid SOC Analytics"
  page_icon: "🛡️"
  layout: "wide"
  default_model: "Hybrid Ensemble"
  default_confidence_threshold: 0.40
